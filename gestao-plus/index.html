<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vértice | Gestão Plus</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<style>:root{font-family:Inter,system-ui,Arial;color:#eee;background:#101114}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #343434;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;color:#d8b76b;font-size:23px}a{color:#e0c37e}button,.btn{border:1px solid #8e743a;background:#c6a65e;color:#161616;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}button.secondary{background:#222;color:#eee;border-color:#555}button:disabled{opacity:.5}main{max-width:1250px;margin:auto;padding:24px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.tabs button{background:#222;color:#eee;border:1px solid #444}.tabs button.active{background:#c6a65e;color:#111}.card{background:#1c1e22;border:1px solid #383838;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:13px;color:#d9d9d9;margin:0 0 10px}input,select,textarea{width:100%;padding:11px;background:#111;color:white;border:1px solid #555;border-radius:7px;margin-top:6px}textarea{min-height:88px}.muted{color:#b8b8b8;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:14px;border-top:1px solid #444;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{font-size:12px;border:1px solid #6b603d;border-radius:30px;padding:4px 8px}#msg{min-height:20px;color:#e5c77f}#gate{max-width:550px;margin:50px auto}.metric{font-size:24px;font-weight:bold;color:#e0c37e}small{color:#b9b9b9}@media(max-width:600px){main{padding:12px}header{padding:14px}.item{align-items:start}}</style></head><body>
<header><div><h1>VÉRTICE · GESTÃO PLUS</h1><small>10 áreas complementares • dados no Supabase</small></div><div class="row"><a href="../">← Voltar ao Gestão</a><button id="logout" class="secondary">Sair</button></div></header>
<main><div id="gate" class="card" hidden><h2>Acesse sua conta Vértice</h2><label>E-mail<input id="email" type="email"></label><label>Senha<input id="password" type="password"></label><button id="signin">Entrar</button><p class="muted">Use o mesmo login do Gestão.</p></div><div id="workspace" hidden><div class="tabs" id="tabs"></div><div id="summary" class="card"></div><section class="card"><h2 id="heading"></h2><p class="muted" id="help"></p><form id="recordForm"><div class="grid"><label id="labelTitulo">Descrição / nome<input name="titulo" required maxlength="180" placeholder="Ex.: Cozinha cliente Maria"></label><label id="labelStatus">Status<select name="status"><option>Pendente</option><option>Em andamento</option><option>Aguardando cliente</option><option>Concluído</option><option>Cancelado</option></select></label><label id="labelData">Data prevista<input type="date" name="data_prevista"></label><label id="labelValor">Valor (R$)<input type="number" name="valor" step="0.01" min="0"></label><label id="labelCliente">ID do cliente (opcional)<input type="number" name="cliente_id" min="1"></label><label id="labelOrcamento">ID do orçamento (opcional)<input type="number" name="orcamento_id" min="1"></label></div><div class="grid" id="extraFields"></div><label id="labelDetalhes">Detalhes, checklist, medições ou observações<textarea name="detalhes" placeholder="Registre informações importantes"></textarea></label><div class="row"><button type="submit" id="save">Salvar registro</button><button type="button" class="secondary" id="clearForm">Limpar formulário</button></div></form></section><section class="card"><h2>Registros cadastrados</h2><div id="records"></div></section></div><p id="msg" role="status"></p></main>
<script>
const modules=[
['producao','Produção','Etapas, responsáveis e prazos dos móveis.'],
['estoque','Estoque e compras','Materiais, compras e necessidades de reposição.'],
['lucro','Lucro por projeto','Custos e resultados registrados por projeto; ainda não substitui a apuração contábil.'],
['medicao','Medição técnica','Medidas, fotos referenciadas, interferências e checklist de visita.'],
['aprovacao','Aprovações','Histórico de versões e decisões; não constitui assinatura eletrônica.'],
['garantia','Garantia','Solicitações de assistência e acompanhamento de resolução.'],
['crm','CRM inteligente','Pendências, contatos e oportunidades comerciais.'],
['portal','Portal do cliente','Controle interno dos conteúdos a publicar; portal externo ainda não implementado.'],
['fornecedores','Fornecedores','Preços, prazos e histórico de fornecedores.'],
['indicadores','Indicadores','Resumo de registros, valores e pendências destes módulos.']
];
const cfg=window.VERTICE_CONFIG;const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);let empresa=null,active='producao',records=[],editing=null;
const $=s=>document.querySelector(s),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function msg(s){$('#msg').textContent=s}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){$('#gate').hidden=false;$('#workspace').hidden=true;return}const {data,error}=await sb.from('perfis').select('empresa_id').eq('user_id',user.id).eq('ativo',true).limit(1);if(error||!data?.length){$('#gate').hidden=false;$('#workspace').hidden=true;msg('Usuário sem perfil ativo: '+(error?.message||'contate o administrador'));return}empresa=data[0].empresa_id;$('#gate').hidden=true;$('#workspace').hidden=false;await load()}
async function load(){const {data,error}=await sb.from('gestao_plus_registros').select('*').eq('empresa_id',empresa).order('criado_em',{ascending:false});if(error){records=[];render();msg('Falha ao carregar registros: '+error.message);return}records=data||[];render();msg('Módulos carregados. Selecione uma aba para testar.')}
const moduleFields={"producao":[["etapa","Etapa","select",["Projeto","Compra","Corte","Fita de borda","Montagem","Instalação","Entrega"]],["responsavel","Responsável","text"]],"estoque":[["material","Material / acabamento","text"],["quantidade","Quantidade","number"],["unidade","Unidade","select",["un","m","m²","chapa","rolo"]]],"lucro":[["receita","Receita prevista (R$)","number"],["custo","Custo realizado (R$)","number"],["taxas","Taxas e depreciação (R$)","number"]],"medicao":[["largura","Largura (mm)","number"],["altura","Altura (mm)","number"],["profundidade","Profundidade (mm)","number"],["interferencias","Tomadas, rodapés e interferências","text"]],"aprovacao":[["versao","Versão do projeto","text"],["acabamento","Material e acabamento aprovados","text"],["aprovado_por","Aprovado por","text"]],"garantia":[["tipo","Tipo de ocorrência","select",["Ajuste","Ferragem","Umidade","Dano","Outro"]],["solucao","Providência / solução","text"]],"crm":[["contato","Canal de contato","select",["WhatsApp","Telefone","E-mail","Presencial"]],["proxima_acao","Próxima ação","text"]],"portal":[["conteudo","Informação a compartilhar","select",["Status do projeto","Documentos","Fotos","Prazo","Outro"]],["observacao_cliente","Observação para o cliente","text"]],"fornecedores":[["contato","Contato do fornecedor","text"],["material","Produto fornecido","text"],["prazo","Prazo de entrega (dias)","number"]],"indicadores":[["indicador","Indicador","select",["Faturamento","Despesa","Orçamento aprovado","Projeto entregue","Outro"]],["periodo","Período de referência","month"]]};
function extraFields(){return (moduleFields[active]||[]).map(([key,label,type,options])=>'<label>'+escapeHtml(label)+(type==='select'?'<select name="extra_'+key+'">'+options.map(x=>'<option>'+escapeHtml(x)+'</option>').join('')+'</select>':'<input name="extra_'+key+'" type="'+type+'" '+(type==='number'?'step="any"':'')+'>')+'</label>').join('')}
const formProfiles={"producao":{"titulo":"Móvel / ordem de produção","data":"Previsão de entrega","valor":"Custo previsto (R$)","detalhes":"Etapas e instruções de fabricação","show":["status","data","valor","cliente","orcamento"]},"estoque":{"titulo":"Material ou item de estoque","data":"Previsão de reposição","valor":"Custo unitário (R$)","detalhes":"Especificações e local de armazenamento","show":["data","valor"]},"lucro":{"titulo":"Projeto para apuração","data":"Data de fechamento","valor":"Valor contratado (R$)","detalhes":"Custos adicionais e observações","show":["data","valor","cliente","orcamento"]},"medicao":{"titulo":"Ambiente medido","data":"Data da visita","detalhes":"Observações da medição técnica","show":["data","cliente","orcamento"]},"aprovacao":{"titulo":"Projeto / revisão","data":"Data limite de aprovação","detalhes":"Alterações e decisões do cliente","show":["status","data","cliente","orcamento"]},"garantia":{"titulo":"Chamado de assistência","data":"Prazo de atendimento","valor":"Custo da assistência (R$)","detalhes":"Descrição do problema e evidências","show":["status","data","valor","cliente","orcamento"]},"crm":{"titulo":"Oportunidade ou contato","data":"Próximo contato","valor":"Valor da oportunidade (R$)","detalhes":"Histórico de atendimento","show":["status","data","valor","cliente"]},"portal":{"titulo":"Atualização a compartilhar","data":"Data da atualização","detalhes":"Conteúdo para o cliente","show":["status","data","cliente","orcamento"]},"fornecedores":{"titulo":"Nome do fornecedor","data":"Próxima compra / entrega","valor":"Último preço cotado (R$)","detalhes":"Condições comerciais","show":["data","valor"]},"indicadores":{"titulo":"Nome do indicador","data":"Data de referência","valor":"Valor do indicador (R$)","detalhes":"Fonte e critério de cálculo","show":["data","valor"]}};
function configureForm(){const p=formProfiles[active];const labels={titulo:'labelTitulo',status:'labelStatus',data:'labelData',valor:'labelValor',cliente:'labelCliente',orcamento:'labelOrcamento',detalhes:'labelDetalhes'};const captions={titulo:p.titulo,status:'Situação',data:p.data||'Data prevista',valor:p.valor||'Valor (R$)',cliente:'ID do cliente (opcional)',orcamento:'ID do orçamento (opcional)',detalhes:p.detalhes};for(const [key,id] of Object.entries(labels)){const el=document.getElementById(id);el.style.display=['titulo','detalhes'].includes(key)||p.show.includes(key)?'block':'none';el.firstChild.textContent=captions[key]}};
function render(){const tabs=$('#tabs');tabs.innerHTML=modules.map(m=>'<button type="button" data-module="'+m[0]+'" class="'+(active===m[0]?'active':'')+'">'+m[1]+'</button>').join('');tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.module;editing=null;document.querySelector('#recordForm').reset();render();msg('Área selecionada: '+modules.find(m=>m[0]===active)[1])}));const m=modules.find(x=>x[0]===active);$('#heading').textContent=m[1];$('#help').textContent=m[2];$('#extraFields').innerHTML=extraFields();configureForm();const mine=records.filter(x=>x.modulo===active);const open=mine.filter(x=>x.status!=='Concluído'&&x.status!=='Cancelado').length;$('#summary').innerHTML='<div class="grid"><div><small>Registros do módulo</small><div class="metric">'+mine.length+'</div></div><div><small>Pendentes / em andamento</small><div class="metric">'+open+'</div></div><div><small>Valores registrados</small><div class="metric">'+money(mine.reduce((s,x)=>s+Number(x.valor||0),0))+'</div></div></div>';$('#records').innerHTML=mine.length?mine.map(x=>'<div class="item"><div><strong>'+escapeHtml(x.titulo)+'</strong><p class="muted">'+escapeHtml(x.dados?.detalhes||'')+'</p><small>'+Object.entries(x.dados||{}).filter(([k,v])=>k!=='detalhes'&&v).map(([k,v])=>escapeHtml(k)+': '+escapeHtml(v)).join(' · ')+'</small><p><small>'+escapeHtml(x.data_prevista||'Sem data')+' · '+money(x.valor)+' · Cliente '+escapeHtml(x.cliente_id||'—')+' · Orçamento '+escapeHtml(x.orcamento_id||'—')+'</small></div><div class="row"><span class="pill">'+escapeHtml(x.status)+'</span><button class="secondary" data-edit="'+x.id+'">Editar</button><button class="secondary" data-delete="'+x.id+'">Excluir</button></div></div>').join(''):'<p class="muted">Nenhum registro nesta área. Use o formulário acima para começar.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete)));$('#save').textContent=editing?'Salvar alterações':'Salvar registro'}
function edit(id){const x=records.find(r=>r.id===id);if(!x)return;active=x.modulo;editing=id;render();const f=$('#recordForm');for(const k of ['titulo','status','data_prevista','valor','cliente_id','orcamento_id'])f.elements[k].value=x[k]??'';f.elements.detalhes.value=x.dados?.detalhes||'';for(const [key] of moduleFields[active]||[]){const el=f.elements['extra_'+key];if(el)el.value=x.dados?.[key]??''}window.scrollTo({top:0,behavior:'smooth'})}
async function remove(id){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.'))return;const {error}=await sb.from('gestao_plus_registros').delete().eq('id',id).eq('empresa_id',empresa);if(error)return msg(error.message);msg('Registro excluído.');await load()}
$('#recordForm').onsubmit=async e=>{e.preventDefault();const f=e.target,p={empresa_id:empresa,modulo:active,titulo:f.elements.titulo.value.trim(),status:f.elements.status.value,data_prevista:f.elements.data_prevista.value||null,valor:f.elements.valor.value?Number(f.elements.valor.value):null,cliente_id:f.elements.cliente_id.value?Number(f.elements.cliente_id.value):null,orcamento_id:f.elements.orcamento_id.value?Number(f.elements.orcamento_id.value):null,dados:{detalhes:f.elements.detalhes.value.trim(),...Object.fromEntries((moduleFields[active]||[]).map(([key])=>[key,f.elements['extra_'+key]?.value||'']))},atualizado_em:new Date().toISOString()};$('#save').disabled=true;const {error}=editing?await sb.from('gestao_plus_registros').update(p).eq('id',editing).eq('empresa_id',empresa):await sb.from('gestao_plus_registros').insert(p);$('#save').disabled=false;if(error)return msg('Não foi possível salvar: '+error.message);editing=null;f.reset();msg('Registro salvo no Supabase.');await load()};
$('#clearForm').onclick=()=>{editing=null;document.querySelector('#recordForm').reset();render()};
$('#signin').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return msg(error.message);msg('');await init()};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};window.addEventListener('error',e=>msg('Erro na página: '+e.message));init().catch(e=>msg('Erro ao iniciar: '+e.message));
</script></body></html>
