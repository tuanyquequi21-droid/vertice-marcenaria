name: Build Vértice Gestão Mobile APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-native/**'
      - '.github/workflows/build-mobile-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        working-directory: mobile-native
        run: npm install
      - name: Generate Android project
        working-directory: mobile-native
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile-native
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vertice-gestao-mobile-debug-apk
          path: mobile-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
