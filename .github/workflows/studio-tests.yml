name: Testes Vértice Studio
on:
  push:
    branches: [auditoria-studio-3d]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do Studio 3D e financeiro
        run: node --test studio/engine.test.mjs tests/financeiro.test.cjs
