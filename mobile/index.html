<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171714"><meta name="description" content="Vértice Gestão Mobile — acesso móvel ao sistema de gestão da marcenaria.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vértice Gestão Mobile</title>
<style>
:root{color-scheme:dark;--bg:#11110f;--panel:#1c1c19;--gold:#d4ad57;--muted:#aaa69b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f4ec}.shell{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}header{height:54px;flex:0 0 54px;background:#171714;border-bottom:1px solid #39352a;display:flex;align-items:center;gap:10px;padding:0 14px}#mobileBack[hidden]{display:none!important}header button{border:1px solid #6b562c;background:#25231d;color:#e0bd69;border-radius:8px;padding:7px 10px;font-weight:700}header img{width:34px;height:34px}header strong{font-size:14px;letter-spacing:.15em}header small{display:block;font-size:9px;letter-spacing:.28em;color:var(--gold);margin-top:2px}.status{margin-left:auto;color:var(--muted);font-size:11px}main{flex:1;min-height:0;position:relative}iframe{border:0;width:100%;height:100%;display:block;background:#f5f5f2}#install{display:none;border:1px solid #9d7c37;background:var(--gold);color:#191710;border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px}footer{padding:7px 12px calc(7px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:#8d897e;background:#171714;border-top:1px solid #39352a}.notice{display:none!important;position:absolute;z-index:30;top:8px;left:8px;right:8px;padding:12px;border-radius:12px;background:#27251f;border:1px solid #8c7137;color:#eee;font-size:13px}.notice.notice-visible{display:block!important}.notice button{float:right;background:none;color:#e2bf69;border:0;font-size:24px;line-height:1;min-width:36px;min-height:36px;cursor:pointer}noscript{padding:20px}
</style>
</head>
<body><div class="shell">
<header><button id="mobileBack" type="button" aria-label="Voltar">‹ Voltar</button><img src="icon.svg" alt=""><div><strong>VÉRTICE</strong><small>GESTÃO MOBILE</small></div><span class="status">Acesso seguro</span><button id="install">Instalar app</button></header>
<main><div class="notice" id="notice"><button id="closeNotice" aria-label="Fechar">×</button><b>Modo mobile</b><br>Você está usando a interface móvel da Gestão. Entre com o mesmo e-mail e senha que já utiliza no sistema.</div><iframe id="gestao" title="Vértice Gestão" src="../index.html"></iframe></main>
<footer>Vértice Marcenaria · Gestão interna · Seus dados continuam no sistema atual</footer>
</div>
<script>
let deferredPrompt;const installBtn=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
const notice=document.getElementById('notice');const closeNotice=document.getElementById('closeNotice');notice.classList.remove('notice-visible');closeNotice.addEventListener('click',()=>{notice.classList.remove('notice-visible');notice.style.display='none';});
const frame=document.getElementById('gestao');
const mobileBack=document.getElementById('mobileBack');
function syncBackButton(){try{const d=frame.contentDocument;const title=d&&d.getElementById('pageTitle');const app=d&&d.getElementById('app');mobileBack.hidden=!!(title&&title.textContent.trim().toLowerCase()==='dashboard')||!!(app&&app.classList.contains('hidden'));}catch(e){mobileBack.hidden=true}}
mobileBack.addEventListener('click',()=>{
 try {
  const d=frame.contentDocument;
  if(d && d.querySelector('#app:not(.hidden)')) {
    const modal=d.querySelector('#modal:not(.hidden)');
    if(modal && typeof frame.contentWindow.closeModal==='function'){frame.contentWindow.closeModal();return;}
    const active=d.querySelector('nav button.active');
    if(active && active.dataset.page!=='dashboard' && typeof frame.contentWindow.page==='function'){frame.contentWindow.page('dashboard');return;}
    if(typeof frame.contentWindow.page==='function'){frame.contentWindow.page('dashboard');return;}
  }
  if(frame.contentWindow.history.length>1) frame.contentWindow.history.back();
 } catch(e) {}
});
frame.addEventListener('load',()=>{
 try {
  const d=frame.contentDocument;
  const menuBtn=d&&d.getElementById('studioMenuToggle');
  const sidebar=d&&d.getElementById('sidebar');
  if(menuBtn&&sidebar&&!menuBtn.dataset.mobileMenuBound){
   menuBtn.dataset.mobileMenuBound='1';
   menuBtn.addEventListener('click',()=>{const open=sidebar.classList.toggle('mobile-menu-expanded');menuBtn.setAttribute('aria-expanded',String(open));menuBtn.textContent=open?'✕ Fechar menu':'☰ Menu';});
  }
  if(d&&d.getElementById('pageTitle')&&!d.getElementById('mobile-back-sync')){
   const marker=d.createElement('span');marker.id='mobile-back-sync';marker.hidden=true;d.body.appendChild(marker);
   new MutationObserver(syncBackButton).observe(d.getElementById('pageTitle'),{childList:true,subtree:true,characterData:true});
   syncBackButton();
  }
 }catch(e){}

 try{
  const d=frame.contentDocument;if(!d||d.getElementById('mobile-overrides'))return;
  const s=d.createElement('style');s.id='mobile-overrides';s.textContent=`
  @media(max-width:800px){
   html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
   body{height:auto!important;min-height:100dvh!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior-y:contain}
   button,a,input,select,textarea{touch-action:manipulation}
   button,a{ -webkit-tap-highlight-color:transparent }
   input,select,textarea{font-size:16px!important;min-height:44px}
   button:not(.modal-head button){min-height:44px}
   .sidebar nav button,.sidebar nav a{min-height:52px!important}
   .sidebar.mobile-menu-expanded{box-shadow:0 -10px 32px rgba(0,0,0,.32)!important}
   .sidebar.mobile-menu-expanded nav button:focus-visible,.sidebar.mobile-menu-expanded nav a:focus-visible{outline:2px solid #d4ad57!important;outline-offset:-3px!important}
   .app:not(.hidden){display:block!important;min-height:100dvh!important;height:auto!important;overflow:visible!important}
   .sidebar{position:fixed!important;z-index:1000!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;width:100%!important;height:auto!important;max-height:74px!important;overflow-x:auto!important;overflow-y:hidden!important;display:flex!important;flex-direction:row!important;align-items:center!important;padding:5px 4px calc(5px + env(safe-area-inset-bottom))!important;background:#171714!important;border-top:1px solid #b18a3c!important;border-right:0!important}
   .sidebar .brand{display:none!important}.sidebar .collapse{display:none!important}.sidebar .logout{display:flex!important;flex:0 0 48px!important;min-width:48px!important;align-items:center!important;justify-content:center!important}
   .sidebar nav{display:flex!important;flex-direction:row!important;gap:3px!important;width:max-content!important;min-width:100%!important}
   .sidebar nav button,.sidebar nav a{flex:0 0 auto!important;min-width:68px!important;min-height:54px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;padding:5px 7px!important;border-radius:8px!important;font-size:19px!important}
   .sidebar nav button em,.sidebar nav a em{display:block!important;font-size:9px!important;font-style:normal!important;white-space:nowrap!important}
   .sidebar nav button span,.sidebar nav a span{font-size:18px!important}
   .sidebar.mobile-menu-expanded{max-height:70vh!important;height:auto!important;flex-direction:column!important;align-items:stretch!important;overflow-y:auto!important;overflow-x:hidden!important;padding-bottom:calc(8px + env(safe-area-inset-bottom))!important}
   .sidebar.mobile-menu-expanded nav{width:100%!important;min-width:0!important;flex-direction:column!important;overflow:visible!important}
   .sidebar.mobile-menu-expanded nav button,.sidebar.mobile-menu-expanded nav a{width:100%!important;min-width:0!important;min-height:44px!important;flex-direction:row!important;justify-content:flex-start!important;padding:9px 16px!important;font-size:15px!important}
   .sidebar.mobile-menu-expanded nav button em,.sidebar.mobile-menu-expanded nav a em{font-size:13px!important}
   .sidebar.mobile-menu-expanded .logout{width:100%!important;flex:0 0 42px!important}
   .main{margin-left:0!important;width:100%!important;min-height:100dvh!important;height:auto!important;overflow:visible!important;padding-bottom:112px!important}
   .topbar{position:sticky!important;top:0!important;z-index:20!important;display:flex!important;flex-wrap:wrap!important;gap:8px!important;padding:12px!important}
   .topbar h2{font-size:20px!important;margin:0!important}
   .top-actions{display:flex!important;flex-wrap:wrap!important;gap:6px!important;width:100%!important}
   .top-actions .btn{font-size:12px!important;padding:9px 10px!important}
   .content{padding:12px 12px 130px!important;min-height:0!important;overflow:visible!important;touch-action:pan-y!important}
   .modal{display:block!important;padding:10px!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}
   .modal-card{width:100%!important;max-width:100%!important;max-height:none!important;height:auto!important;overflow:visible!important;margin:0 auto 12px!important;border-radius:16px 16px 8px 8px!important}
   #modalBody,#modalBody .modal-body{overflow:visible!important;max-height:none!important;touch-action:pan-y!important;padding-bottom:12px!important}.modal-head{position:sticky!important;top:0!important}.modal-actions{position:sticky!important;bottom:0!important;z-index:5!important;flex-wrap:wrap!important}
   #modalBody input,#modalBody select,#modalBody textarea{position:relative!important;z-index:1!important;pointer-events:auto!important;touch-action:manipulation!important}
   input,select,textarea,button{max-width:100%}
   table{display:block!important;max-width:100%!important;overflow-x:auto!important}
  }
  `;d.head.appendChild(s);
  const login=d.querySelector('#login');if(login){const st=d.createElement('style');st.textContent='@media(max-width:800px){.login-shell{min-height:100dvh!important;padding:18px!important}.login-card{width:100%!important;max-width:420px!important;padding:24px!important}}';d.head.appendChild(st)}
  // Mobile-only cleanup: keep the original Gestión modules, omit Plus and make the landing screen useful.
  // Preserve all original Gestão modules and navigation controls on mobile.
  const app=d.querySelector('#app'),loginBox=d.querySelector('#login');
  if(app&&!app.dataset.mobileRouteBound){
    app.dataset.mobileRouteBound='1';
    const goToUsefulPage=()=>{
      if(!app.classList.contains('hidden')){
        const active=d.querySelector('nav button[data-page="leads"]');
        if(active && !active.dataset.mobileAutoOpened){active.dataset.mobileAutoOpened='1';active.click();}
      }
    };
    new MutationObserver(goToUsefulPage).observe(app,{attributes:true,attributeFilter:['class']});
    goToUsefulPage();
  }
 }catch(e){console.warn('Mobile styling unavailable',e)}
});
</script></body></html>
