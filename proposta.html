<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta Vértice</title><link rel="stylesheet" href="assets/css/app-v4.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="proposal-public"><main class="proposal-shell"><div class="brand-public">VÉRTICE <small>MARCENARIA</small></div><div id="proposal">Carregando proposta...</div></main><script src="config.js"></script><script>
const sbp=supabase.createClient(VERTICE_CONFIG.SUPABASE_URL,VERTICE_CONFIG.SUPABASE_PUBLISHABLE_KEY),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let token=new URLSearchParams(location.search).get('t');
(async()=>{if(!token)return proposal.innerHTML='<h2>Link inválido.</h2>';let {data,error}=await sbp.rpc('get_proposta_publica',{p_token:token});if(error||!data)return proposal.innerHTML='<h2>Proposta não encontrada.</h2>';let o=data,opts=o.opcoes||[];proposal.innerHTML=`<h1>Proposta #${o.id}</h1><p>Olá, <b>${esc(o.cliente_nome)}</b>.</p><div class=public-card><h2>${esc(o.projeto||'Móveis sob medida')}</h2><div class=public-total>${money(o.preco_final)}</div><p><b>Pagamento:</b> ${esc(o.forma_pagamento||'A combinar')}${o.numero_parcelas>1?' • '+o.numero_parcelas+' parcelas':''}</p><p><b>Prazo:</b> ${o.prazo_entrega_dias?o.prazo_entrega_dias+' dias':'A combinar'}</p>${o.observacoes_cliente?'<p>'+esc(o.observacoes_cliente)+'</p>':''}</div>${opts.length?'<h2>Opções</h2>'+opts.map(x=>`<div class="public-card ${x.destaque?'recommended':''}"><b>${esc(x.nome)}</b><span>${money(x.valor)}</span><p>${esc(x.descricao||'')}</p></div>`).join(''):''}${o.aceite_em?'<div class=accepted>✓ Proposta aprovada.</div>':`<div class=accept-box><label>Nome para aceite<input id=acceptName value="${esc(o.cliente_nome||'')}"></label><button class="btn gold" onclick="approve()">Aprovar proposta</button></div>`}`})()
async function approve(){let nome=document.getElementById('acceptName').value.trim();if(!nome)return alert('Informe seu nome.');if(!confirm('Confirma a aprovação desta proposta?'))return;let {data,error}=await sbp.rpc('aprovar_proposta_publica',{p_token:token,p_nome:nome});if(error||!data)return alert('Não foi possível registrar o aceite.');location.reload()}
</script></body></html>
