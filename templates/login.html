<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Vértice</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body class="login-page"><div class="login-card"><div class="brand centered"><div class="brand-mark">V</div><div><strong>Vértice</strong><span>Marcenaria</span></div></div><div class="login-copy"><span class="eyebrow">ÁREA ADMINISTRATIVA</span><h1>Bem-vinda de volta.</h1><p>Orçamentos, clientes e custos em um só lugar.</p></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-btn full">Entrar no sistema</button></form></div></body></html>
